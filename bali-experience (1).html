<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali Experience — Healing Journey Through the Island of Gods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132724;
    --stone:#eaf6f3;
    --stone-2:#dcefe9;
    --charcoal:#0d3634;
    --charcoal-2:#0a2b29;
    --sunset:#0fa393;
    --sunset-deep:#0c8477;
    --paddy:#128a7a;
    --paddy-deep:#0a4744;
    --gold:#d7b268;
    --cream:#f5fbf9;
    --whatsapp:#25d366;
    --whatsapp-deep:#1ebc5a;
    --line: rgba(19,39,36,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    line-height:1.08;
    margin:0;
    letter-spacing:-0.01em;
  }
  em{font-style:italic;color:var(--sunset-deep);}
  p{margin:0;}
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  .eyebrow{
    font-family:'Work Sans',sans-serif;
    font-size:12.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--sunset-deep);
    font-weight:600;
    display:flex;align-items:center;gap:10px;
  }
  .eyebrow svg{width:16px;height:16px;flex-shrink:0;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px;
    cursor:pointer;border:1.5px solid transparent;text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    font-family:'Work Sans',sans-serif;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--sunset);color:#fff;box-shadow:0 10px 24px -8px rgba(226,112,58,0.6);}
  .btn-primary:hover{background:var(--sunset-deep);}
  .btn-ghost{background:transparent;border-color:rgba(255,255,255,0.55);color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,0.12);}
  .btn-dark{background:var(--charcoal);color:#fff;}
  .btn-dark:hover{background:#000;}
  .btn-whatsapp{background:var(--whatsapp);color:#fff;box-shadow:0 10px 24px -8px rgba(37,211,102,0.55);}
  .btn-whatsapp:hover{background:var(--whatsapp-deep);}

  /* ---------- NAV ---------- */
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(251,246,236,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1180px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:19px;}
  .logo svg{width:26px;height:26px;}
  .nav-actions{display:flex;align-items:center;gap:10px;}
  .pill-toggle{
    display:flex;background:var(--stone-2);border-radius:999px;padding:3px;font-size:13px;font-weight:600;
  }
  .pill-toggle button{
    border:none;background:transparent;padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--ink);
    font-family:'Work Sans',sans-serif;font-weight:600;font-size:13px;
  }
  .pill-toggle button.active{background:var(--charcoal);color:#fff;}
  .icon-btn{
    width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn svg{width:18px;height:18px;}

  /* ---------- SHORTCUT BAR ---------- */
  .shortcut-bar{
    background:var(--charcoal-2);
    border-bottom:1px solid rgba(255,255,255,0.08);
    position:sticky;top:63px;z-index:49;
  }
  .shortcut-inner{
    max-width:1180px;margin:0 auto;padding:10px 28px;
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  }
  .shortcut-inner::-webkit-scrollbar{display:none;}
  .shortcut-item{
    display:flex;align-items:center;gap:7px;flex-shrink:0;
    padding:8px 15px;border-radius:999px;background:rgba(255,255,255,0.06);
    color:rgba(245,251,249,0.88);font-size:13px;font-weight:600;
    text-decoration:none;border:1px solid rgba(255,255,255,0.08);
    cursor:pointer;font-family:'Work Sans',sans-serif;
    transition:background .15s ease;
  }
  .shortcut-item:hover{background:rgba(255,255,255,0.14);}
  .shortcut-item svg{width:16px;height:16px;flex-shrink:0;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;min-height:92vh;display:flex;align-items:flex-end;
    background:linear-gradient(180deg, rgba(10,43,41,0.30) 0%, rgba(10,60,56,0.58) 55%, rgba(8,45,42,0.94) 100%),
      url('https://commons.wikimedia.org/wiki/Special:FilePath/Bali%20%E2%80%93%20Rice%20terrace%20(2687336831).jpg?width=1600') center/cover no-repeat;
    color:#fff;padding-top:120px;
  }
  .hero-inner{max-width:1180px;margin:0 auto;padding:0 28px 72px;width:100%;}
  .hero .eyebrow{color:#f2c98f;}
  .hero h1{font-size:clamp(38px,6vw,72px);color:#fff;max-width:800px;margin-top:18px;}
  .hero p.lead{font-size:18px;max-width:560px;margin-top:20px;color:rgba(255,255,255,0.88);}
  .hero-actions{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
  .hero-stats{display:flex;gap:34px;margin-top:56px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,0.22);padding-top:26px;}
  .hero-stats div b{display:block;font-family:'Fraunces',serif;font-size:26px;font-weight:600;}
  .hero-stats div span{font-size:12.5px;color:rgba(255,255,255,0.7);}

  /* ---------- SECTION GENERIC ---------- */
  section{padding:96px 0;}
  .section-head{max-width:640px;margin-bottom:52px;}
  .section-head h2{font-size:clamp(28px,4vw,44px);margin-top:14px;}
  .section-head p{margin-top:16px;color:#5c5346;font-size:16.5px;}
  .dark{background:var(--charcoal);color:var(--cream);}
  .dark .section-head p{color:rgba(251,246,236,0.72);}
  .dark h2{color:#fff;}
  .paddy-bg{background:var(--paddy-deep);color:var(--cream);}
  .paddy-bg h2{color:#fff;}
  .paddy-bg .section-head p{color:rgba(251,246,236,0.78);}

  /* canang divider */
  .divider{display:flex;align-items:center;gap:14px;margin:0 0 18px;}
  .divider svg{width:22px;height:22px;flex-shrink:0;}
  .divider span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold);}

  /* ---------- WHY HEALING ---------- */
  .healing-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:60px;align-items:center;}
  .healing-card{background:var(--stone);border-radius:22px;padding:34px;border:1px solid var(--line);}
  .healing-card + .healing-card{margin-top:18px;}
  .healing-card h3{font-size:19px;margin-bottom:8px;}
  .healing-card p{color:#5c5346;font-size:15px;}
  .healing-num{font-family:'Fraunces',serif;font-style:italic;color:var(--sunset);font-size:15px;margin-bottom:6px;display:block;}

  /* ---------- NATURE GRID ---------- */
  .nature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;}
  .nature-card{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/4;}
  .nature-card img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
  .nature-card:hover img{transform:scale(1.06);}
  .nature-card .overlay{
    position:absolute;inset:0;background:linear-gradient(180deg, transparent 40%, rgba(20,17,13,0.88) 100%);
    display:flex;align-items:flex-end;padding:18px;
  }
  .nature-card .overlay h4{color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
  .nature-card .overlay p{color:rgba(255,255,255,0.78);font-size:12.5px;margin-top:4px;}

  /* ---------- DISTANCE ---------- */
  .distance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .distance-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;}
  .distance-card svg{width:30px;height:30px;color:var(--sunset);margin-bottom:14px;}
  .distance-card h3{font-size:17px;margin-bottom:12px;}
  .distance-row{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-top:1px dashed var(--line);color:#5c5346;}
  .distance-row b{color:var(--ink);font-weight:600;}

  /* ---------- RESTO ---------- */
  .resto-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;}
  .resto-col h3{font-size:20px;margin-bottom:6px;}
  .resto-col > p{color:rgba(251,246,236,0.7);font-size:14px;margin-bottom:22px;}
  .resto-item{display:flex;gap:16px;padding:16px 0;border-top:1px solid rgba(255,255,255,0.14);}
  .resto-item img{width:78px;height:78px;border-radius:12px;object-fit:cover;flex-shrink:0;}
  .resto-item h4{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:#fff;}
  .resto-item p{font-size:13.5px;color:rgba(251,246,236,0.68);margin-top:4px;}
  .tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(226,112,58,0.18);color:#f2a879;padding:3px 9px;border-radius:999px;margin-top:6px;}

  /* ---------- CULTURE ---------- */
  .culture-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;}
  .culture-media{position:relative;border-radius:24px;overflow:hidden;}
  .culture-media img{width:100%;height:460px;object-fit:cover;}
  .culture-list{list-style:none;padding:0;margin:22px 0 0;}
  .culture-list li{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);}
  .culture-list b{display:block;font-size:15.5px;}
  .culture-list p{font-size:14px;color:#5c5346;margin-top:3px;}
  .culture-list svg{width:20px;height:20px;color:var(--paddy);flex-shrink:0;margin-top:3px;}

  /* ---------- PACKAGES ---------- */
  .pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .pkg-card{background:#fff;border-radius:22px;border:1px solid var(--line);padding:32px;display:flex;flex-direction:column;}
  .pkg-card.featured{background:var(--charcoal);color:#fff;border-color:var(--charcoal);position:relative;transform:translateY(-10px);}
  .pkg-card.featured .pkg-price, .pkg-card.featured h3{color:#fff;}
  .pkg-card.featured .pkg-desc{color:rgba(251,246,236,0.7);}
  .pkg-badge{position:absolute;top:-13px;right:28px;background:var(--sunset);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;letter-spacing:.05em;}
  .pkg-card h3{font-size:20px;}
  .pkg-desc{font-size:13.5px;color:#8a7f6d;margin-top:6px;min-height:36px;}
  .pkg-price{font-family:'Fraunces',serif;font-size:32px;font-weight:600;margin-top:18px;}
  .pkg-price span{font-size:13px;font-weight:400;color:#8a7f6d;}
  .pkg-card.featured .pkg-price span{color:rgba(251,246,236,0.6);}
  .pkg-feat{list-style:none;padding:0;margin:22px 0;flex-grow:1;}
  .pkg-feat li{display:flex;gap:9px;font-size:13.5px;padding:7px 0;align-items:flex-start;}
  .pkg-feat svg{width:15px;height:15px;color:var(--paddy);flex-shrink:0;margin-top:2px;}
  .pkg-card.featured .pkg-feat svg{color:#f2c98f;}
  .pkg-card .btn{width:100%;margin-top:6px;}

  /* ---------- GUIDE ---------- */
  .guide-wrap{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;}
  .guide-media img{border-radius:24px;width:100%;height:420px;object-fit:cover;}
  .guide-check{display:flex;gap:12px;margin-top:14px;}
  .guide-check svg{width:20px;height:20px;color:var(--sunset);flex-shrink:0;margin-top:2px;}
  .guide-check p{font-size:14.5px;color:#5c5346;}

  /* ---------- POLL / CTA ---------- */
  .poll{
    background:var(--stone);border-radius:28px;padding:60px;text-align:center;
    border:1px solid var(--line);
  }
  .poll h2{font-size:clamp(26px,4vw,38px);}
  .poll p{margin-top:14px;color:#5c5346;max-width:480px;margin-left:auto;margin-right:auto;}
  .poll-actions{display:flex;gap:16px;justify-content:center;margin-top:30px;flex-wrap:wrap;}
  .poll-answer{margin-top:22px;font-family:'Fraunces',serif;font-style:italic;font-size:17px;color:var(--sunset-deep);min-height:26px;}

  /* ---------- FOUNDERS ---------- */
  .founders-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  .founder-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;}
  .founder-avatar{
    width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--sunset),var(--gold));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:26px;font-weight:600;
    margin-bottom:20px;overflow:hidden;
  }
  .founder-avatar img{width:100%;height:100%;object-fit:cover;}
  .founder-card h3{font-size:20px;}
  .founder-role{font-size:12.5px;color:var(--sunset-deep);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:4px;}
  .founder-card p.bio{margin-top:16px;font-size:14.5px;color:#5c5346;}

  /* ---------- CURRENCY MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,17,13,0.62);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff;border-radius:22px;padding:32px;max-width:420px;width:100%;
    box-shadow:0 30px 60px -12px rgba(0,0,0,0.35);
  }
  .modal-box .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-box h3{font-size:19px;}
  .modal-close{cursor:pointer;background:var(--stone-2);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .conv-row{display:flex;gap:10px;margin-bottom:14px;}
  .conv-row input, .conv-row select{
    flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-family:'Work Sans',sans-serif;font-size:14.5px;background:var(--cream);
  }
  .conv-swap{
    display:flex;justify-content:center;margin:-2px 0 12px;
  }
  .conv-swap button{background:var(--stone-2);border:none;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .conv-result{
    background:var(--stone);border-radius:14px;padding:18px;text-align:center;margin-top:6px;
  }
  .conv-result b{font-family:'Fraunces',serif;font-size:24px;display:block;}
  .conv-result span{font-size:12px;color:#8a7f6d;}
  .conv-note{font-size:11.5px;color:#8a7f6d;margin-top:12px;text-align:center;}

  /* ---------- CLOSING ---------- */
  .closing{
    position:relative;min-height:80vh;display:flex;align-items:center;
    background:linear-gradient(180deg, rgba(8,38,36,0.40), rgba(6,36,34,0.88)),
      url('https://commons.wikimedia.org/wiki/Special:FilePath/Balinese%20Kecak%20dance.jpg?width=1600') center 30%/cover no-repeat;
    color:#fff;text-align:center;
  }
  .closing-inner{max-width:640px;margin:0 auto;padding:80px 28px;}
  .closing .eyebrow{justify-content:center;color:#f2c98f;}
  .closing h2{color:#fff;font-size:clamp(30px,5vw,50px);margin-top:16px;}
  .closing p{color:rgba(255,255,255,0.82);margin-top:16px;font-size:16px;}
  .qr-card{
    background:rgba(255,255,255,0.96);border-radius:22px;padding:26px 30px;display:inline-flex;gap:20px;align-items:center;
    margin-top:38px;text-align:left;
  }
  .qr-card img{width:110px;height:110px;border-radius:12px;}
  .qr-card h4{font-family:'Fraunces',serif;font-size:16px;color:var(--ink);}
  .qr-card p{font-size:12.5px;color:#6b6152;margin-top:4px;max-width:180px;}

  footer{background:var(--charcoal);color:rgba(251,246,236,0.55);padding:40px 0;font-size:13px;text-align:center;}
  footer b{color:#fff;}

  @media(max-width:980px){
    .healing-grid,.culture-grid,.guide-wrap,.founders-grid{grid-template-columns:1fr;gap:36px;}
    .culture-media img,.guide-media img{height:320px;}
    .nature-grid{grid-template-columns:repeat(2,1fr);}
    .distance-grid{grid-template-columns:1fr;}
    .resto-grid{grid-template-columns:1fr;gap:8px;}
    .pkg-grid{grid-template-columns:1fr;}
    .pkg-card.featured{transform:none;}
    .qr-card{flex-direction:column;text-align:center;}
    .qr-card p{max-width:none;}
    section{padding:64px 0;}
  }
  @media(max-width:640px){
    .nav-inner{padding:14px 18px;}
    .pill-toggle button{padding:6px 10px;font-size:11.5px;}
    .wrap{padding:0 18px;}
    .nature-grid{grid-template-columns:1fr 1fr;}
    .hero{padding-top:100px;}
    .poll{padding:36px 22px;}
  }
</style>
</head>
<body>

<!-- ============ NAV ============ -->
<nav>
  <div class="nav-inner">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="8" y="17" width="32" height="23" rx="7" fill="#0fa393"/>
        <rect x="8" y="17" width="32" height="23" rx="7" fill="url(#lg1)" opacity="0.25"/>
        <path d="M18 17v-4a6 6 0 0112 0v4" stroke="#0a4744" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <rect x="13" y="24" width="22" height="6.5" rx="2" fill="#f5fbf9" opacity="0.9"/>
        <circle cx="18" cy="27.2" r="1.4" fill="#0fa393"/>
        <circle cx="30" cy="27.2" r="1.4" fill="#0fa393"/>
        <rect x="21.5" y="34" width="5" height="3.4" rx="1.2" fill="#d7b268"/>
        <defs><linearGradient id="lg1" x1="8" y1="17" x2="40" y2="40"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#0a4744"/></linearGradient></defs>
      </svg>
      Bali Experience
    </div>
    <div class="nav-actions">
      <button class="icon-btn" onclick="openConverter()" title="Kurs Mata Uang / Currency">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 8h4a2 2 0 010 4H9m6 4H9m3-8v10"/></svg>
      </button>
      <div class="pill-toggle">
        <button id="btn-id" class="active" onclick="setLang('id')">ID</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>
</nav>

<!-- ============ SHORTCUT BAR ============ -->
<div class="shortcut-bar">
  <div class="shortcut-inner">
    <a href="#beach" class="shortcut-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>
      <span data-i18n="sc_beach"></span>
    </a>
    <a href="#mountain" class="shortcut-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 20l6-11 4 6 3-5 7 10H2z"/></svg>
      <span data-i18n="sc_mountain"></span>
    </a>
    <a href="#resto" class="shortcut-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3v8a3 3 0 006 0V3M9 11v10M18 3v18M18 3c-2 0-3 2-3 4s1 3 3 3"/></svg>
      <span data-i18n="sc_resto"></span>
    </a>
    <a href="#packages" class="shortcut-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h16v9a1 1 0 01-1 1H5a1 1 0 01-1-1v-9z"/><path d="M9 10V7a3 3 0 016 0v3"/></svg>
      <span data-i18n="sc_hotel"></span>
    </a>
    <a href="#culture" class="shortcut-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M6 8l12-3M6 16l12 3"/></svg>
      <span data-i18n="sc_culture"></span>
    </a>
    <span class="shortcut-item" onclick="openConverter()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 8h4a2 2 0 010 4H9m6 4H9m3-8v10"/></svg>
      <span data-i18n="sc_money"></span>
    </span>
  </div>
</div>

function setLang(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[lang][key] !== undefined){
      el.innerHTML = dict[lang][key];
    }
  });
  document.getElementById('btn-id').classList.toggle('active', lang==='id');
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.documentElement.lang = lang;
  window.__currentLang = lang;
}
setLang('id');

/* ================= POLL ================= */
function answerPoll(v){
  const box = document.getElementById('poll-answer');
  const lang = window.__currentLang || 'id';
  const messages = {
    id: { yes: "Senang mendengarnya! Yuk rencanakan kunjungan berikutnya bersama kami 🌴", no: "Ini saat yang tepat untuk memulai — mari kami bantu rencanakan perjalanan pertamamu! 🌺" },
    en: { yes: "Great to hear! Let's plan your next visit together 🌴", no: "There's no better time to start — let us help plan your first trip! 🌺" }
  };
  box.textContent = messages[lang][v];
}

/* ================= CURRENCY CONVERTER ================= */
function openConverter(){
  document.getElementById('conv-modal').classList.add('open');
  convertCurrency();
}
function closeConverter(){
  document.getElementById('conv-modal').classList.remove('open');
}
document.getElementById('conv-modal').addEventListener('click', e=>{
  if(e.target.id === 'conv-modal') closeConverter();
});
function swapCurrency(){
  const from = document.getElementById('conv-from');
  const to = document.getElementById('conv-to');
  const tmp = from.value;
  from.value = to.value;
  to.value = tmp;
  convertCurrency();
}
let convTimer;
function convertCurrency(){
  clearTimeout(convTimer);
  convTimer = setTimeout(doConvert, 300);
}
async function doConvert(){
  const amount = parseFloat(document.getElementById('conv-amount').value) || 0;
  const from = document.getElementById('conv-from').value;
  const to = document.getElementById('conv-to').value;
  const resultText = document.getElementById('conv-result-text');
  const rateText = document.getElementById('conv-rate-text');
  const lang = window.__currentLang || 'id';
  rateText.textContent = lang==='id' ? 'Memuat kurs terkini…' : 'Loading live rate…';
  if(from === to){
    resultText.textContent = amount.toLocaleString() + ' ' + to;
    rateText.textContent = lang==='id' ? 'Mata uang sama' : 'Same currency';
    document.getElementById('conv-amount-to').value = amount.toLocaleString();
    return;
  }
  try{
    const res = await fetch(`https://api.frankfurter.app/latest?amount=${amount}&from=${from}&to=${to}`);
    if(!res.ok) throw new Error('fetch failed');
    const data = await res.json();
    const converted = data.rates[to];
    resultText.textContent = converted.toLocaleString(undefined,{maximumFractionDigits:2}) + ' ' + to;
    document.getElementById('conv-amount-to').value = converted.toLocaleString(undefined,{maximumFractionDigits:2});
    rateText.textContent = (lang==='id' ? 'Kurs: 1 ' : 'Rate: 1 ') + from + ' = ' + (converted/amount).toLocaleString(undefined,{maximumFractionDigits:6}) + ' ' + to;
  }catch(err){
    resultText.textContent = '—';
    rateText.textContent = lang==='id' ? 'Gagal memuat kurs. Coba lagi.' : 'Failed to load rate. Try again.';
  }
}
